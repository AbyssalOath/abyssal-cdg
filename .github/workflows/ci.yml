name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check / test / clippy / fmt (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libx11-dev libasound2-dev pkg-config libfontconfig1-dev libfreetype6-dev

      - name: Install Rust 1.99
        # Pinned to 1.99: Rust 1.100 no longer compiles objc2 0.4.1 (macOS-only,
        # pulled in by eframe 0.28 via winit 0.29/glutin 0.31) - error E0277 in
        # objc2's ivar_forwarding_impls.rs - and there's no fixed 0.4.x. Drop the
        # pin once eframe/egui are upgraded past 0.28 (newer winit uses objc2 0.5+).
        # Keep this in step with release.yml's pin.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo build (all targets)
        run: cargo build --all-targets

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # Checks Cargo.lock against the RustSec advisory database
      # (https://rustsec.org) - known-vulnerable or yanked dependency
      # versions fail the build.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit
