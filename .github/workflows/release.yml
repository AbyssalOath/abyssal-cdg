name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
            formats: dmg

          - platform: macos-latest
            target: x86_64-apple-darwin
            arch: x64
            formats: dmg

          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: amd64
            formats: deb,appimage

          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
            formats: nsis,wix

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxkbcommon-dev \
            libx11-dev \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            pkg-config \
            libfuse2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        # cargo-packager downloads its per-format toolchains (NSIS, WiX,
        # linuxdeploy, etc.) from GitHub release assets on first use, and
        # that CDN occasionally returns a transient 502/504 - retry a few
        # times with backoff before giving up, rather than failing the
        # whole release on a network blip.
        run: |
          for attempt in 1 2 3; do
            if cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.formats }} --verbose; then
              exit 0
            fi
            echo "cargo packager failed (attempt $attempt/3)"
            sleep $((attempt * 15))
          done
          exit 1

      - name: Rename assets
        shell: bash
        run: |
          shopt -s nullglob
          cd "target/${{ matrix.target }}/release"
          version="${GITHUB_REF_NAME#v}"
          arch="${{ matrix.arch }}"
          mkdir -p ../../../dist
          for f in *-setup.exe; do
            cp "$f" "../../../dist/Abyssal-CDG-Creator_${version}_${arch}-setup.exe"
          done
          for f in *.msi; do
            cp "$f" "../../../dist/Abyssal-CDG-Creator_${version}_${arch}_en-US.msi"
          done
          for f in *.dmg; do
            cp "$f" "../../../dist/Abyssal-CDG-Creator_${version}_${arch}.dmg"
          done
          for f in *.AppImage; do
            cp "$f" "../../../dist/Abyssal-CDG-Creator_${version}_${arch}.AppImage"
          done
          for f in *.deb; do
            cp "$f" "../../../dist/Abyssal-CDG-Creator_${version}_${arch}.deb"
          done

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: abyssal-cdg-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
