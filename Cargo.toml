[package]
name = "abyssal-cdg"
version = "0.1.0"
edition = "2021"
authors = ["LordSodomiser"]
description = "Turns an audio file and pasted lyrics into a real karaoke .cdg file"
license-file = "LICENSE"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["glow", "default_fonts", "persistence", "wayland", "x11"] }
egui = "0.28"
rfd = "0.14"
rodio = { version = "0.19", default-features = false, features = ["symphonia-all"] }
symphonia = { version = "0.5", features = ["all"] }
font8x8 = "0.3"
anyhow = "1.0"
ab_glyph = "0.2.32"

[profile.release]
opt-level = 2

# Config for `cargo packager` (see .github/workflows/release.yml), which
# builds the downloadable installers/images attached to GitHub releases.
[package.metadata.packager]
product-name = "Abyssal CDG Creator"
identifier = "com.lordsodomiser.abyssal-cdg"
category = "Music"
icons = ["assets/icons/abyssal-cdg-icon.png"]

# eframe (winit/glow) needs an X11 or Wayland stack plus xkbcommon, GTK3 is
# needed for the native "load audio file" dialog (`rfd`), and ALSA is
# needed for audio playback (`rodio`).
[package.metadata.packager.deb]
depends = ["libgtk-3-0", "libasound2", "libx11-6", "libxkbcommon0"]
