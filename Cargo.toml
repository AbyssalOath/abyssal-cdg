[package]
name = "abyssal-cdg"
version = "0.1.6"
edition = "2021"
authors = ["LordSodomiser"]
description = "Turns an audio file and pasted lyrics into a real karaoke .cdg file"
license-file = "LICENSE"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["glow", "default_fonts", "persistence", "wayland", "x11"] }
egui = "0.28"
rfd = "0.14"
rodio = { version = "0.19", default-features = false, features = ["symphonia-all"] }
symphonia = { version = "0.5", features = ["all"] }
font8x8 = "0.3"
anyhow = "1.0"
ab_glyph = "0.2.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Decodes a user-picked background image (album art, ...) for the video
# export/preview - PNG/JPEG/GIF/BMP/WebP/TIFF via the default features.
image = "0.25"
# System font enumeration/loading for the optional custom lyric-text font
# (video export + live preview only - see fonts.rs for why the .cdg export
# can't use this). Actively maintained (part of the Servo browser engine);
# chosen over the smaller `font-loader` crate, which hasn't been touched in
# several years. On Linux this dlopen's libfontconfig at runtime rather than
# linking it, so a system without it doesn't stop the app from starting -
# font enumeration/loading just fails gracefully (as a `Result`) if it's
# genuinely missing, which in practice is rare on any desktop that already
# has GTK3 installed (already a hard dependency here via `rfd`).
font-kit = "0.14"

# ONNX Runtime bindings, for native (no Python/audio-separator/aeneas) ML
# inference - vocal separation (`vocals.rs`/`mdx.rs`) and forced alignment
# (`align.rs`/`ctc.rs`). `load-dynamic` loads the actual ONNX Runtime
# shared library (.dll/.so/.dylib) at *runtime* from a path this app
# resolves itself (see `onnxrt.rs`), rather than linking against one
# fetched at build time (`download-binaries`) - deliberately, since
# ONNX Runtime's own prebuilt binaries don't cover macOS x86_64 (dropped
# between 1.23 and 1.25), so that one target needs a from-source build
# (see the release workflow) bundled the same way as the other three,
# with the exact same runtime-loading code path for all four rather than
# a special case just for Intel Mac.
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
# `ort`'s own "ndarray" feature pulls in `ndarray` with its `std` feature
# off (feature-unification quirk), which fails to build - depending on it
# directly here with default features forces `std` back on.
ndarray = "0.17"
# Real-input FFT, for the MDX-Net STFT/ISTFT (see stft.rs) - built on
# `rustfft`, which does the actual FFT math.
realfft = "3.5"
# Writes the separated stems to plain WAV - pure Rust, no licensing
# questions. MP3 output for this feature still shells out to `ffmpeg`
# (like the video export already does) until that's addressed wholesale.
hound = "3.5"
# High-quality resampling to the model's fixed 44.1kHz input rate, for
# input audio loaded at a different native sample rate.
rubato = "5.0"
# HTTP client for the model-download path (see model_assets.rs) -
# bundled/dev-build-fallback for vocal removal's model, the normal path
# for auto-align's per-language models.
ureq = "3.4"
# Locates the per-user cache directory for the same fallback path.
dirs = "6.0"
# NFC normalization for forced-alignment tokenization (ctc.rs) - Korean's
# syllable-block vocab only matches precomposed text, so input lyric text
# is normalized before being matched against a language's vocab.
unicode-normalization = "0.1"
# Pure-Rust bzip2 *decompression* (no compression needed) - Cisco
# distributes its official openh264 binaries as .bz2 (see ffmpeg_path.rs
# for why this app downloads that specific binary rather than bundling a
# self-compiled one).
bzip2-rs = "0.1"

# Only does anything when targeting Windows (see build.rs) - embeds the app
# icon into the compiled .exe itself, since `cargo packager` only sets the
# *installer's* icon (see the `icons` key below), not the exe's own PE
# resources. Without this, the installed app/shortcuts/taskbar show
# Windows' generic executable icon no matter what `cargo packager` is told.
[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2

# Config for `cargo packager` (see .github/workflows/release.yml), which
# builds the downloadable installers/images attached to GitHub releases.
[package.metadata.packager]
product-name = "Abyssal CDG Creator"
identifier = "com.lordsodomiser.abyssal-cdg"
category = "Music"
# The "@2x" suffix tells the packager this source is a high-density (retina)
# asset - without it, the packager treats a 1024px-wide icon as a 1x asset,
# which isn't a valid ICNS size (1024px only exists as the 512x512@2x icon
# type) and macOS packaging fails with "No matching IconType". Named "@2x",
# the same file is correctly read as the 512x512@2x icon instead. macOS
# (.icns) and Linux (.deb/AppImage) icons are both generated/used straight
# from this PNG. Windows is different: `cargo packager` has no PNG->.ico
# conversion of its own, and a PNG isn't a valid Windows icon resource, so
# a real pre-built multi-resolution .ico is listed first - it's picked
# over the PNG for the installer/shortcut icon on Windows, while macOS/
# Linux packaging keeps using the PNG above.
icons = ["assets/icons/abyssal-cdg-icon.ico", "assets/icons/abyssal-cdg-icon@2x.png"]

# Bundles the vocal-separation ONNX model, the ONNX Runtime shared
# library, and a custom-built ffmpeg (+ the openh264 library it loads for
# H.264 encoding) into every installer, so every ML/video/audio feature
# works with nothing to install separately (see
# model_assets.rs/onnxrt.rs/ffmpeg_path.rs) - none of these are checked
# into git (large binaries), all fetched/built into these paths by the
# release workflow just before packaging.
resources = ["assets/models", "assets/onnxruntime", "assets/ffmpeg"]

# eframe (winit/glow) needs an X11 or Wayland stack plus xkbcommon, GTK3 is
# needed for the native "load audio file" dialog (`rfd`), ALSA is needed for
# audio playback (`rodio`), and fontconfig is needed for system font
# enumeration/loading (`font-kit`, for the custom lyric-text font - see
# fonts.rs). font-kit dlopen's fontconfig at runtime rather than linking it,
# so its absence wouldn't stop the app from starting even without this
# listed - but it's declared explicitly anyway so the font picker actually
# works out of the box rather than silently finding no fonts.
[package.metadata.packager.deb]
depends = ["libgtk-3-0", "libasound2", "libx11-6", "libxkbcommon0", "libfontconfig1"]

# "-" is codesign's own ad-hoc identity (no paid Apple Developer account
# needed) - load-bearing, not cosmetic, and only for Apple Silicon: without
# *any* signature, an arm64 .app fails to launch at all ("... is damaged
# and can't be opened"), because Apple Silicon's kernel-level code-signing
# enforcement (AMFI) requires every executable to carry at least a valid
# ad-hoc signature just to be loaded - a stricter, separate check from
# Gatekeeper's own "unidentified developer" quarantine policy (the one the
# README's right-click-Open/xattr workaround addresses). An unsigned
# x86_64 build has no such kernel-level requirement (confirmed directly:
# it already ran fine, quarantine warning and all, before this was added),
# which is also why it runs fine via Rosetta 2 on an Apple Silicon Mac -
# only a *native* arm64 launch hits AMFI's requirement. Ad-hoc signing
# doesn't remove the Gatekeeper prompt (that still needs the README's
# workaround, or a paid Developer ID + notarization, neither set up here)
# - it only makes the arm64 build launchable at all in the first place.
[package.metadata.packager.macos]
signing-identity = "-"
